<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chromodoro</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="dashboard.css">
  <script type="module" src="dashboard.js"></script>
</head>
<body>
  <main>
    <header class="header"><img src="icons/icon48.png" width="26" height="26" alt=""><span class="brand">chromodoro<span class="brand-dot">.</span></span></header>
    <section class="card heat-card">
      <div class="card-top"><span id="heat-range" class="muted"></span><button id="export" class="small-button">CSV <span aria-hidden="true">↓</span></button></div>
      <div class="heat-scroll" id="heat-scroll">
        <div class="heat-months" id="heat-months" aria-hidden="true"></div>
        <div class="heat-grid" id="heat-grid" role="grid" aria-label="Completed Pomodoros by day over the last year. Use the arrow keys to move between days."></div>
      </div>
      <div class="heat-foot"><span id="heat-total" class="muted"></span><span class="heat-legend" aria-hidden="true">Less<i class="sq"></i><i class="sq l1"></i><i class="sq l2"></i><i class="sq l3"></i><i class="sq l4"></i>More</span></div>
    </section>
    <section class="card">
      <form id="settings-form">
        <div class="settings-grid">
          <label>Focus <span class="input-wrap"><input name="focus" type="number" min="1" max="180" required value="25"><span>min</span></span></label>
          <label>Short break <span class="input-wrap"><input name="shortBreak" type="number" min="1" max="60" required value="5"><span>min</span></span></label>
          <label>Long break <span class="input-wrap"><input name="longBreak" type="number" min="1" max="90" required value="15"><span>min</span></span></label>
          <label>Long break every <span class="input-wrap"><input name="longEvery" type="number" min="1" max="12" required value="4"><span>sessions</span></span></label>
        </div>
        <div class="settings-bottom">
          <span class="alert-label">When a session ends<label class="checkbox"><input type="checkbox" name="notify"> Notification</label><label class="checkbox"><input type="checkbox" name="newTab"> New tab</label></span>
          <span class="settings-actions"><span id="save-status" role="status" class="save-status"></span><button type="submit" class="small-button save">Save</button></span>
        </div>
      </form>
    </section>
    <p id="error" role="alert" hidden></p>
  </main>
</body>
</html>
